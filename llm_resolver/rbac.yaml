apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-resolver
  namespace: control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-resolver
  namespace: chaos
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]   # list: list_workloads; patch: image/resources/env/restart
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]            # list: verification and get_pods read the pods behind a Deployment
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]                    # get_pod_logs
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]            # get_events
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]           # get_configmap / set_configmap_value
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch"]   # list_services / patch_service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-resolver
  namespace: chaos
subjects:
  - kind: ServiceAccount
    name: llm-resolver
    namespace: control
roleRef:
  kind: Role
  name: llm-resolver
  apiGroup: rbac.authorization.k8s.io
