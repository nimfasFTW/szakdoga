apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-resolver-config
  namespace: control
data:
  WATCHED_NAMESPACES: "chaos"
  VERIFY_STABLE_S: "10"  
  VERIFY_POLL_S: "2"
  VERIFY_TIMEOUT_S: "60"  
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"  
  MAX_CPU_UTIL: "0.5"      
  MAX_REPLICAS: "5"         # ceiling for the scale_deployment tool
  AGENT_MAX_STEPS: "20"    
  LLM_MODEL: "gemini-3.7-flash"
  LLM_RPM: "20"             # max model calls per minute (free tier = 5). Set "0" to disable once you have a paid key

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-resolver
  namespace: control
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: llm-resolver
  template:
    metadata:
      labels:
        app: llm-resolver
    spec:
      serviceAccountName: llm-resolver
      containers:
        - name: llm-resolver
          image: nimfasftw/szakdoga_llm_resolver:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: llm-resolver-config
            - secretRef:
                name: llm-resolver-secret

---

apiVersion: v1
kind: Service
metadata:
  name: llm-resolver
  namespace: control
spec:
  selector:
    app: llm-resolver
  ports:
    - port: 8000
      targetPort: 8000