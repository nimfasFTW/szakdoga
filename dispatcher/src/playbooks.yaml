playbooks:

  - id: oom-bump-small
    match: { termination_reason: OOMKilled, attempt: 0 }
    action: bump_memory_limit
    params: { increase_pct: 25, max_limit_mib: 256, timeout_s: 60 }

  - id: oom-bump-large
    match: { termination_reason: OOMKilled, attempt: 1 }
    action: bump_memory_limit
    params: { increase_pct: 100, max_limit_mib: 256, timeout_s: 60 }

  - id: imagepull-wait
    match: { waiting_reason: ImagePull, termination_reason: null, attempt: 0 }
    action: wait_and_verify
    params: { wait_s: 60 }

  - id: cpu-scale-out
    match: { alertname: ChaosPodCPUSaturated, waiting_reason: null, termination_reason: null, attempt: 0 }
    action: scale_deployment
    params: { add_replicas: 2, max_replicas: 5, timeout_s: 90 }

  - id: cpu-scale-out-more
    match: { alertname: ChaosPodCPUSaturated, waiting_reason: null, termination_reason: null, attempt: 1 }
    action: scale_deployment
    params: { add_replicas: 2, max_replicas: 5, timeout_s: 90 }