# Read-only for now (enrichment only). Extend when the executor lands:
#   apps/deployments: get, patch   |   configmaps: get, patch   |   pods: delete (if you restart pods directly)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
  namespace: control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
  namespace: chaos
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
  namespace: chaos
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: control
roleRef:
  kind: Role
  name: dispatcher
  apiGroup: rbac.authorization.k8s.io
