apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-config
  namespace: control
data:
  WATCHED_NAMESPACES: "chaos"
  DISPATCH_MODE: "hybrid"                    # deterministic | hybrid | llm
  DETER_RESOLVER_SVC_NAME: "deter-resolver"
  LLM_RESOLVER_SVC_NAME: "llm-resolver"
  RESOLVER_TIMEOUT_S: "180"     
  LLM_RESOLVER_TIMEOUT_S: "300"  
  LLM_MAX_ATTEMPTS: "2"         
  INCIDENT_LEASE_S: "360"        
  ATTEMPT_TTL_S: "600"       

---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: control
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      serviceAccountName: dispatcher
      containers:
        - name: dispatcher
          image: nimfasftw/szakdoga_dispatcher:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dispatcher-config

---

apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: control
spec:
  selector:
    app: dispatcher
  ports:
    - port: 8000
      targetPort: 8000