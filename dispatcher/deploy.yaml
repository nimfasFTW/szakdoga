apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-config
  namespace: chaos
data:
  WATCHED_NAMESPACES: "chaos"
  DETER_RESOLVER_SVC_NAME: "deter-resolver"
  RESOLVER_TIMEOUT_S: "180"   # must exceed the longest verification window
  INCIDENT_LEASE_S: "300"     # must exceed RESOLVER_TIMEOUT_S, or a lock could expire mid-incident
  ATTEMPT_TTL_S: "600"        # an abandoned incident is forgotten after this long

---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: chaos
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      serviceAccountName: dispatcher
      containers:
        - name: dispatcher
          image: nimfasftw/szakdoga_dispatcher:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dispatcher-config

---

apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: chaos
spec:
  selector:
    app: dispatcher
  ports:
    - port: 8000
      targetPort: 8000