apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      containers:
        - name: dispatcher
          image: nimfasftw/szakdoga_dispatcher:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: chaos
spec:
  selector:
    app: dispatcher
  ports:
    - port: 8000
      targetPort: 8000