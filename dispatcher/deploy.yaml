apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher-config
  namespace: control
data:
  WATCHED_NAMESPACES: "chaos"
  DISPATCH_MODE: "hybrid"                    # deterministic | hybrid | llm
  DETER_RESOLVER_SVC_NAME: "deter-resolver"
  LLM_RESOLVER_SVC_NAME: "llm-resolver"
  RESOLVER_TIMEOUT_S: "180"       # must exceed the longest verification window
  LLM_RESOLVER_TIMEOUT_S: "300"   # LLM agent runs are slower; tune to your agent's worst case
  LLM_MAX_ATTEMPTS: "2"           # LLM runs per incident before the dispatcher gives up
  INCIDENT_LEASE_S: "360"         # must exceed BOTH timeouts, or a lock could expire mid-incident
  ATTEMPT_TTL_S: "600"            # an abandoned incident is forgotten after this long

---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: control
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      serviceAccountName: dispatcher
      containers:
        - name: dispatcher
          image: nimfasftw/szakdoga_dispatcher:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dispatcher-config

---

apiVersion: v1
kind: Service
metadata:
  name: dispatcher
  namespace: control
spec:
  selector:
    app: dispatcher
  ports:
    - port: 8000
      targetPort: 8000