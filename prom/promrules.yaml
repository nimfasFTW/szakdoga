apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chaos-experiment-rules
  namespace: chaos
spec:
  groups:
    - name: chaos-experiments
      rules:

        - alert: ChaosPodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="chaos",
              reason="CrashLoopBackOff"
            } == 1
          for: 0s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"

        - alert: ChaosPodImagePullFailure
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="chaos",
              reason=~"ErrImagePull|ImagePullBackOff"
            } == 1
          for: 0s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"

        - alert: ChaosPodNotReady
          expr: |
            kube_pod_status_ready{
              namespace="chaos",
              condition="false"
            } == 1
          for: 15s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"


        # CPU saturation: usage over 90 % of the CPU limit. Pod-scoped (namespace/pod/container labels),
        # like the other alerts, so the dispatcher needs no special path for it.
        # cAdvisor refreshes its counters only every ~10 s, hence the 30 s rate window and the delay of
        # this alert compared to the kube-state-metrics based ones.
        - alert: ChaosPodCPUSaturated
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{
                namespace="chaos", container!="", container!="POD"
              }[30s])
            )
            / on (namespace, pod, container)
            kube_pod_container_resource_limits{namespace="chaos", resource="cpu"}
            > 0.9
          for: 5s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} uses more than 90% of its CPU limit"

#  Alerting rules without the keep_firing_for clause will deactivate on the first evaluation where the condition is not met