apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: chaos-experiment-rules
  namespace: chaos
spec:
  groups:
    - name: chaos-experiments
      rules:

        - alert: ChaosPodCrashLooping
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="chaos",
              reason="CrashLoopBackOff"
            } == 1
          for: 0s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"

        - alert: ChaosPodImagePullFailure
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace="chaos",
              reason=~"ErrImagePull|ImagePullBackOff"
            } == 1
          for: 0s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"

        - alert: ChaosPodNotReady
          expr: |
            kube_pod_status_ready{
              namespace="chaos",
              condition="false"
            } == 1
          for: 15s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"


        - alert: ChaosPodCPUSaturated
          expr: |
            sum by (namespace, pod) (
              rate(container_cpu_usage_seconds_total{namespace="chaos"}[30s])
            )
            /
            sum by (namespace, pod) (
              kube_pod_container_resource_limits{namespace="chaos", resource="cpu"}
            )
            > 0.9
          for: 5s
          labels:
            severity: warning
            experiment: chaos
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} uses more than 90% of its CPU limit"