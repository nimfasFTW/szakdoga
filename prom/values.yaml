defaultRules:
  create: false

alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 1m

    route:
      group_by:
        - alertname
        - namespace
        - pod
      group_wait: 0s
      group_interval: 1s
      repeat_interval: 1m
      receiver: dispatcher-webhook

    receivers:
      - name: dispatcher-webhook
        webhook_configs:
          - url: http://dispatcher.control.svc.cluster.local:8000/alert
            send_resolved: true

      - name: "null"

prometheus:
  prometheusSpec:
    scrapeInterval: 2s
    evaluationInterval: 2s
    scrapeTimeout: 2s
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}

kube-state-metrics:
  prometheus:
    monitor:
      interval: 2s             # the ServiceMonitor can override the global interval
      scrapeTimeout: 2s

grafana:
  enabled: true