# UC1: low memory limit
# the memory limit is set too low, the deterministic workflow has to increase
# small increase is enough

apiVersion: v1
kind: ConfigMap
metadata:
  name: uc1-config
  namespace: chaos
data:
  UC_CODE: "uc1"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: chaos
  name: uc1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc1
  template:
    metadata:
      labels:
        app: uc1
    spec:
      containers:
        - name: uc1
          image: nimfasftw/szakdoga_chaos:latest
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: uc1-config
          resources:
            requests:
              memory: "100Mi"
            limits:
              memory: "100Mi"

# To define memory limits:
# minikube addons enable metrics-server
# https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/
