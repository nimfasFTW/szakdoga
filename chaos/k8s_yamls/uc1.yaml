apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: chaos
  name: uc1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc2
  template:
    metadata:
      labels:
        app: uc2
  spec:
    containers:
      - name: uc1
        image: nimfasftw/szakdoga_chaos:latest
        stdin: true
        tty: true
        env:
          - name: UC_CODE
            value: "uc1"
        resources:
          requests:
            memory: "100Mi"
          limits:
            memory: "100Mi"
    


  # to define memory limits, 
  # minikube addons enable metrics-server]
  # https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/