# UC9: heavy load, no autoscaler.
# This manifest is the HEALTHY starting state: one replica, a CPU limit, no HorizontalPodAutoscaler.
# The fault is injected by applying uc9_load.yaml (delete it to stop the load).
#
# Capacity of one pod: every /work request burns ~50 ms of CPU time (UC9_WORK_MS) and the CPU limit is
# 250m, so one pod serves at most ~4.5 req/s (the Flask overhead adds a few ms per request).
# The load generator sends 10 req/s:
#   1 replica  -> ~220 % of the capacity  (saturated)
#   2 replicas -> ~110 %                  (still saturated)
#   3 replicas -> ~73 % of the limit      (healthy)
# Recalibrate UC9_WORK_MS / the CPU limit / UC9_RATE together if you change one of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uc9-config
  namespace: chaos
data:
  UC_CODE: "uc9"
  APP_PORT: "8080"
  UC9_WORK_MS: "50"
  UC9_MAX_IN_FLIGHT: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc9
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc9
  template:
    metadata:
      labels:
        app: uc9
    spec:
      containers:
        - name: uc9
          image: nimfasftw/szakdoga_chaos:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: uc9-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: uc9
  namespace: chaos
spec:
  selector:
    app: uc9
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
