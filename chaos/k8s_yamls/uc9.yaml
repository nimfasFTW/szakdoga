# UC9: heavy load, no autoscaler.
# This manifest is the HEALTHY starting state: one replica, a CPU limit, no HorizontalPodAutoscaler.
# The fault is injected by applying uc9_load.yaml (delete it to stop the load).
#
# Capacity of one pod. A request burns 50 ms of CPU time in the busy loop (UC9_WORK_MS) but costs ~0.1 CPU-second
# in total on Minikube (measured: 0.82 utilisation per pod at 5 replicas and 10 req/s => 2 req/s x 0.1 s / 0.25 CPU).
# With a 250m limit one pod therefore serves at most ~2.5 req/s. The load generator sends 5 req/s (uc9_load.yaml):
#   1 replica  -> ~200 % of the limit (saturated)
#   2 replicas -> ~100 %               (still saturated)
#   3 replicas -> ~67 %                (healthy, the first playbook tier +2 is enough)
#   5 replicas -> ~40 %
# At 10 req/s even the ceiling of 5 replicas sits at ~80-85 %, right at the threshold: do not use that.
# Recalibrate UC9_RATE / UC9_WORK_MS / the CPU limit together if you change one of them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uc9-config
  namespace: chaos
data:
  UC_CODE: "uc9"
  APP_PORT: "8080"
  UC9_WORK_MS: "50"
  UC9_MAX_IN_FLIGHT: "8"      # few concurrent requests: less thread contention, latency stays below the 5 s client timeout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc9
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc9
  template:
    metadata:
      labels:
        app: uc9
    spec:
      containers:
        - name: uc9
          image: nimfasftw/szakdoga_chaos:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: uc9-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # No readinessProbe on purpose. With one, the saturated (CPU-throttled) pod misses its probes,
          # drops out of the Service, stops getting load, recovers, and flaps. Its CPU average then never
          # stays above the alert threshold, and ChaosPodNotReady fires instead of ChaosPodCPUSaturated.
          # UC9 is about capacity, so the pod must stay in the Service and simply be slow.
---
apiVersion: v1
kind: Service
metadata:
  name: uc9
  namespace: chaos
spec:
  selector:
    app: uc9
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
