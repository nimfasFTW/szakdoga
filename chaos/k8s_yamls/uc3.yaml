# UC3: misconfigured db port
# the db port the client tries to query is misconfigured, the readiness probe fails
# llm should notice the typo and fix the port number

apiVersion: v1
kind: ConfigMap
metadata:
  name: uc3-server-config
  namespace: chaos
data:
  UC_CODE: "uc3_server"
  UC3_DB_MODE_CODE: "correct"
  UC3_DB_PORT: "5000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc3-server
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc3-server
  template:
    metadata:
      labels:
        app: uc3-server
    spec:
      containers:
        - name: uc3-server
          image: nimfasftw/szakdoga_chaos:latest
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: uc3-server-config
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  namespace: chaos
  name: uc3-server-service
spec:
  selector:
    app: uc3-server
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uc3-client-config
  namespace: chaos
data:
  UC_CODE: "uc3_client"
  # intentionally misconfigured
  UC3_DB_HOST: "uc3-server-service"
  UC3_DB_PORT: "5090"
  UC3_CLIENT_PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc3-client
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc3-client
  template:
    metadata:
      labels:
        app: uc3-client
    spec:
      containers:
        - name: uc3-client
          image: nimfasftw/szakdoga_chaos:latest
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: uc3-client-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2