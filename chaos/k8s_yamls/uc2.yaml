# UC2: very low memory limit
# the memory limit is set way too low, the deterministic workflow has to increase
# small increase is not enough, bigger step applied

apiVersion: v1
kind: ConfigMap
metadata:
  name: uc2-config
  namespace: chaos
data:
  UC_CODE: "uc2"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc2-deployment
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc2
  template:
    metadata:
      labels:
        app: uc2
    spec:
      containers:
        - name: uc2
          image: nimfasftw/szakdoga_chaos:latest
          imagePullPolicy: Always
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: uc2-config
          resources:
            requests:
              memory: "100Mi"
            limits:
              memory: "100Mi"