apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc2-deployment
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc2
  template:
    metadata:
      labels:
        app: uc2
    spec:
      containers:
        - name: uc2
          image: nimfasftw/szakdoga_chaos:latest
          imagePullPolicy: Always
          stdin: true
          tty: true
          env:
            - name: UC_CODE
              value: "uc2"
          resources:
            requests:
              memory: "100Mi"
            limits:
              memory: "100Mi"