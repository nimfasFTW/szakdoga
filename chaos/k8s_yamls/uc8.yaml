# ---------- app1: "db" server ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: uc8-server-config
  namespace: chaos
data:
  UC_CODE: "uc8_server"
  UC8_DB_PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc8-server
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc8-server
  template:
    metadata:
      labels:
        app: uc8-server
    spec:
      containers:
        - name: uc8-server
          image: nimfasftw/szakdoga_chaos:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: uc8-server-config
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: uc8-server-service
  namespace: chaos
spec:
  # using this to allow routing even if the readiness probes fail
  publishNotReadyAddresses: true
  selector:
    app: uc8-server
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uc8-client-config
  namespace: chaos
data:
  UC_CODE: "uc8_client"
  UC8_DB_HOST: "uc8-server-service"
  UC8_DB_PORT: "5000"
  UC8_CLIENT_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uc8-client
  namespace: chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uc8-client
  template:
    metadata:
      labels:
        app: uc8-client
    spec:
      containers:
        - name: uc8-client
          image: nimfasftw/szakdoga_chaos:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: uc8-client-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2