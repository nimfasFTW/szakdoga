
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deter-resolver
  namespace: control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deter-resolver
  namespace: chaos
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]    
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deter-resolver
  namespace: chaos
subjects:
  - kind: ServiceAccount
    name: deter-resolver
    namespace: control
roleRef:
  kind: Role
  name: deter-resolver
  apiGroup: rbac.authorization.k8s.io
