apiVersion: v1
kind: ConfigMap
metadata:
  name: deter-resolver-config
  namespace: control
data:
  WATCHED_NAMESPACES: "chaos"
  VERIFY_STABLE_S: "10"   # a fixed workload must stay ready, with no restarts, for this long
  VERIFY_POLL_S: "2"
  # CPU saturation criterion of the verification (UC-9): a pod above MAX_CPU_UTIL of its CPU limit is not healthy.
  # Leave PROMETHEUS_URL empty to disable it.
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  MAX_CPU_UTIL: "0.9"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: deter-resolver
  namespace: control
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: deter-resolver
  template:
    metadata:
      labels:
        app: deter-resolver
    spec:
      serviceAccountName: deter-resolver
      containers:
        - name: deter-resolver
          image: nimfasftw/szakdoga_deter_resolver:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: deter-resolver-config

---

apiVersion: v1
kind: Service
metadata:
  name: deter-resolver
  namespace: control
spec:
  selector:
    app: deter-resolver
  ports:
    - port: 8000
      targetPort: 8000